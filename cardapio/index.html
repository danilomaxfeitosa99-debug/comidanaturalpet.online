<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comida natural para o seu cão</title>
<meta name="description" content="Receba no WhatsApp receitas naturais para cães, guia para começar e lista semáforo.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0d130f;--card:#000;--ink:#fff;--muted:#a9b7ad;--accent:#9bd36b;--btn:#7cc245;--btn2:#93d85c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1f3a1a 0,#0d130f 60%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:900px;min-height:620px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.photo{position:relative;background:#000 url(../receitas/img/priscila.jpg) 78% center/cover no-repeat}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 70%,#000 100%)}
.copy{display:flex;flex-direction:column;justify-content:center;padding:44px 40px 44px 8px}
.kicker{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;margin-bottom:18px}
.kicker i{display:block;width:44px;height:1px;background:#666}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,5vw,52px);line-height:1.08;font-weight:700}
h1 em{display:block;font-weight:400;color:var(--accent)}
.sub{margin-top:16px;font-size:14px;line-height:1.5;color:var(--muted);max-width:340px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;padding:18px 28px;background:var(--btn);color:#0b1607;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 0 28px rgba(124,194,69,.45)}
.btn:hover{background:var(--btn2)}
.note{margin-top:14px;text-align:center;font-size:11px;color:var(--muted)}
.links{margin-top:12px;text-align:center;font-size:11px;color:#777}
.links a{color:#8a8a8a;text-decoration:none;padding:0 6px}
@media(max-width:640px){
 body{padding:14px;align-items:flex-start}
 .card{grid-template-columns:1fr;min-height:0}
 .photo{height:320px;background-position:75% 0}
 .photo:after{background:linear-gradient(180deg,rgba(0,0,0,0) 50%,#000 100%)}
 .copy{padding:6px 24px 30px}
 .sub{max-width:none}
}
</style>
</head>
<body>
<main class="card">
  <div class="photo" role="img" aria-label="Priscila Alcântara com cães"></div>
  <div class="copy">
    <p class="kicker">Priscila Alcântara &middot; Pet Natural <i></i></p>
    <h1>Comida de verdade<em>na tigela do seu cão.</em></h1>
    <p class="sub">Receitas naturais, guia para começar e lista semáforo dos alimentos. Receba primeiro no WhatsApp.</p>
    <a class="btn" id="wa" href="https://wa.me/557991158456?text=Oi!%20Quero%20saber%20mais%20sobre%20a%20alimentacao%20natural%20para%20o%20meu%20cao">Receber no WhatsApp</a>
    <p class="note">Leva menos de 1 minuto</p>
    <p class="links"><a href="../receitas/termos.html">Termos</a>&middot;<a href="../receitas/privacidade.html">Privacidade</a></p>
  </div>
</main>
<script src="https://track.nexustracker.online/t.js" data-api="https://track.nexustracker.online" defer></script>
</body>
</html>
